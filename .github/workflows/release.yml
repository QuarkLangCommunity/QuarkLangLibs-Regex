name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 打包 .qk 与文档
        run: |
          mkdir -p dist
          zip -r "dist/QuarkLangLibs-Regex-${GITHUB_REF_QuarkLangLibs-Regex}.zip" . -x '.git/*' -x 'dist/*'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: QuarkLangLibs-Regex-package
          path: dist/*
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
